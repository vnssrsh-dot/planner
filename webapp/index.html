<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#F5F5F3">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Планер справ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Сторінка 1: нагадувалка на сьогодні -->
  <main class="app page" id="page-today">
    <header class="hero">
      <svg class="spark" id="heroIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      <div class="hero-date" id="todayDate"></div>
      <h1 id="greeting">Привіт</h1>
      <p class="motto" id="motto"></p>
      <div class="hero-progress" id="heroProgress" hidden>
        <span id="progressLabel"></span>
        <div class="bar"><i id="progressFill"></i></div>
      </div>
    </header>

    <section class="overdue" id="t-overdue" hidden>
      <div class="section-title urgent">Не виконано раніше</div>
      <ul class="list" id="t-overdueList"></ul>
    </section>

    <div class="section-title" id="t-listTitle" hidden>Справи на сьогодні</div>
    <ul class="list" id="t-taskList"></ul>
    <div class="empty" id="t-empty" hidden></div>

    <details class="done-block" id="t-doneBlock" hidden>
      <summary id="t-doneSummary"></summary>
      <ul class="list" id="t-doneList"></ul>
    </details>
  </main>

  <!-- Сторінка 2: календар -->
  <main class="app page" id="page-calendar" hidden>
    <section class="calendar card">
      <header class="cal-head">
        <button class="icon-btn" id="prevMonth" aria-label="Попередній місяць">‹</button>
        <h1 id="monthTitle"></h1>
        <button class="icon-btn" id="nextMonth" aria-label="Наступний місяць">›</button>
      </header>
      <div class="weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Нд</span>
      </div>
      <div class="grid" id="grid"></div>
      <button class="today-link" id="gotoToday" hidden>Повернутися до сьогодні</button>
    </section>

    <header class="day-head">
      <div>
        <div class="day-label" id="dayLabel"></div>
        <h2 id="dayTitle"></h2>
      </div>
      <div class="progress" id="progress" hidden>
        <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15"/><circle class="ring" id="progressBar" cx="18" cy="18" r="15"/></svg>
        <span id="progressText"></span>
      </div>
    </header>

    <ul class="list" id="c-taskList"></ul>
    <div class="empty" id="c-empty" hidden></div>

    <details class="done-block" id="c-doneBlock" hidden>
      <summary id="c-doneSummary"></summary>
      <ul class="list" id="c-doneList"></ul>
    </details>
  </main>

  <button class="fab" id="addBtn" aria-label="Додати завдання">+</button>

  <nav class="tabbar">
    <button class="tab" data-page="today" aria-label="Сьогодні">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
      <span>Сьогодні</span>
      <b class="badge" id="todayBadge" hidden></b>
    </button>
    <button class="tab" data-page="calendar" aria-label="Календар">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Календар</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <form class="sheet" id="sheet" hidden autocomplete="off">
    <div class="sheet-grip"></div>
    <h3 id="sheetTitle">Нове завдання</h3>
    <label class="field">
      <span>Що потрібно зробити</span>
      <input name="title" maxlength="200" required placeholder="Наприклад, зателефонувати мамі">
    </label>
    <div class="row">
      <label class="field"><span>Дата</span><input type="date" name="date" required></label>
      <label class="field"><span>Час <i>(необов’язково)</i></span><input type="time" name="time"></label>
    </div>
    <label class="field">
      <span>Нотатка</span>
      <textarea name="note" rows="2" maxlength="1000" placeholder="Деталі, адреса, посилання…"></textarea>
    </label>
    <div class="sheet-actions">
      <button type="button" class="btn danger" id="deleteBtn" hidden>Видалити</button>
      <button type="button" class="btn ghost" id="cancelBtn">Скасувати</button>
      <button type="submit" class="btn primary" id="saveBtn">Зберегти</button>
    </div>
  </form>

  <div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastUndo">Скасувати</button></div>

  <script src="/static/app.js"></script>
</body>
</html>
