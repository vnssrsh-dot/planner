# Ritmoza на Cloudflare Workers (безкоштовний план):
# бот через вебхук, API для Mini App, статика з ../webapp, база D1, нагадування — Cron.
name = "ritmoza"
main = "src/index.js"
compatibility_date = "2025-10-01"
# Не стирати змінні, додані вручну в Cloudflare (напр. ADMIN_ID), під час deploy з GitHub
keep_vars = true

# Mini App: файли інтерфейсу віддаються як статичні ресурси
[assets]
directory = "../webapp"
binding = "ASSETS"
# Головну сторінку віддає Worker: підставляє номер версії, щоб Telegram не тримав старі файли
run_worker_first = true

# Номер розгортання — для автооновлення Mini App
[version_metadata]
binding = "CF_VERSION_METADATA"

# База даних. ID не вказано навмисно — Wrangler створить базу сам під час першого deploy.
[[d1_databases]]
binding = "DB"
database_name = "ritmoza"

# Журнал запусків і помилок (Cloudflare → Observability)
[observability]
enabled = true

# Перевірка нагадувань щохвилини
[triggers]
crons = ["* * * * *"]

[vars]
DEFAULT_TZ = "Europe/Kyiv"
MORNING_HOUR = "9"
EVENING_HOUR = "21"
REMIND_BEFORE_MIN = "15"
# BOT_TOKEN і ADMIN_ID задаються як секрети (Settings → Variables and Secrets), не тут!
